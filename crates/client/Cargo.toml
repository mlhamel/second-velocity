[package]
name = "sv-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "second-velocity"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, default-features = false, features = [
    "2d_bevy_render",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "picking",
    "scene",
    "bevy_asset",
    "bevy_log",
    "bevy_state",
    "reflect_auto_register",
    "async_executor",
    "bevy_winit",
    "bevy_clipboard",
    "default_font",
    "multi_threaded",
    "std",
    "x11",
    "wayland",
    "custom_cursor",
    "sysinfo_plugin",
    "audio",
    "bevy_gilrs",
    "serialize",
    "png",
    "tonemapping_luts",
    "zstd_rust",
] }
bevy_replicon.workspace = true
bevy_replicon_renet2.workspace = true
clap.workspace = true
sv-core.workspace = true
sv-data.workspace = true
