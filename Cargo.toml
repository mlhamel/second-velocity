[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/data",
    "crates/protocol",
    "crates/server",
    "crates/client",
    "crates/mcp",
    "crates/log",
    "crates/pilot",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sv-core = { path = "crates/core" }
sv-data = { path = "crates/data" }
sv-protocol = { path = "crates/protocol" }
sv-server = { path = "crates/server" }
sv-pilot = { path = "crates/pilot" }

bevy = "0.19"
bevy_replicon = "0.41"
bevy_replicon_renet2 = { version = "0.19.1", features = [
    "memory_transport",
    "native_transport",
] }
clap = { version = "4", features = ["derive"] }
glam = "0.32"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.5", features = ["server", "transport-io"] }
rusqlite = { version = "0.33", features = ["bundled"] }
argon2 = "0.5"
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
ureq = { version = "3", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"